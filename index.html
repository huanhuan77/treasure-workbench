<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>宝藏工作台</title>
    <!-- 闪屏样式 -->
    <style>
      html, body { margin: 0; padding: 0; background: linear-gradient(160deg,#ffe4e6 0%,#fce7f3 40%,#fef3c7 100%); min-height: 100dvh; }
      /* 桌面端闪屏背景改成中性浅灰，与 PC 版主题一致；手机端保持原暖色渐变 */
      @media (min-width: 768px) {
        html, body { background: #f1f2f4; }
      }
      .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .splash-logo { font-size: 48px; margin-bottom: 12px; animation: pop 0.6s ease-out; }
      .splash-title { font-size: 18px; color: #4a2c3a; font-weight: 700; letter-spacing: 1px; }
      .splash-loading { margin-top: 24px; width: 32px; height: 32px; border: 3px solid rgba(252,231,243,0.6); border-top-color: #ec4899; border-radius: 50%; animation: spin 0.8s linear infinite; }
      .splash-tip { margin-top: 16px; font-size: 12px; color: #9ca3af; opacity: 0.8; }
      @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div class="splash-logo">📝</div>
        <div class="splash-title">宝藏工作台</div>
        <div class="splash-loading"></div>
        <div class="splash-tip">加载中...</div>
      </div>
    </div>
    <!-- 首屏兜底：GitHub Pages 的 CDN 边缘偶发 503 / 传输中断时，
         页面会永远停在「加载中…」。这里检测 splash 是否还在，
         超过 12 秒就提示重试并自动刷新一次（带随机参数绕过坏缓存）。 -->
    <script>
      (function () {
        var reloaded = false;
        function splashing() {
          var root = document.getElementById('root');
          return !!(root && root.querySelector('.splash'));
        }
        function hardReload() {
          try {
            var base = location.href.split('#')[0].split('?')[0];
            location.replace(base + '?r=' + Date.now() + (location.hash || ''));
          } catch (e) { location.reload(); }
        }
        function fail() {
          if (!splashing()) return;
          var spin = document.querySelector('.splash-loading');
          if (spin) spin.style.display = 'none';
          var tip = document.querySelector('.splash-tip');
          if (tip) {
            tip.innerHTML = '网络或缓存异常，点这里重试';
            tip.style.color = '#ec4899';
            tip.style.fontWeight = '600';
            tip.style.fontSize = '14px';
            tip.style.cursor = 'pointer';
            tip.onclick = hardReload;
          }
          if (!reloaded) { reloaded = true; setTimeout(hardReload, 1500); }
        }
        setTimeout(fail, 12000);
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) setTimeout(fail, 400);
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
