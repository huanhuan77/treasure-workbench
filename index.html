<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>宝藏工作台</title>
    <!-- 闪屏样式 -->
    <style>
      html, body { margin: 0; padding: 0; background: linear-gradient(160deg,#ffe4e6 0%,#fce7f3 40%,#fef3c7 100%); min-height: 100dvh; }
      .splash { text-align: center; padding: 40px 16px; animation: fadeIn 0.6s; }
      .splash-logo { font-size: 48px; margin-bottom: 12px; }
      .splash-title { font-size: 18px; color: #4a2c3a; font-weight: 700; }
      .splash-loading { margin: 20px auto 0; width: 32px; height: 32px; border: 3px solid #fce7f3; border-top-color: #ec4899; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div class="splash-logo">📦</div>
        <div class="splash-title">宝藏工作台</div>
        <div class="splash-loading"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
